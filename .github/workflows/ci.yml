name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Scripts skipped: the postinstall downloads Chromium, which the tests
      # and the smoke test do not need (they never reach carrefour.fr).
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Smoke test with checkout enabled
        run: node scripts/smoke.mjs
        env:
          CARREFOUR_ENABLE_CHECKOUT: '1'
