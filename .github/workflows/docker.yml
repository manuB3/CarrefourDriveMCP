name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/carrefourdrivemcp

jobs:
  test-image:
    name: Build and test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: carrefour-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name cm --shm-size=1g -p 8787:8787 -p 6080:6080 \
            -e MCP_PUBLIC_URL=http://localhost:8787 \
            -e MCP_AUTH_PASSWORD=ci-password-not-secret \
            -e MCP_AUTH_TOKEN=ci-static-token-0123456789abcdef0123456789 \
            -e VNC_PASSWORD=civnc123 \
            carrefour-mcp:test
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8787/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8787/healthz

      - name: MCP over HTTP
        run: |
          T=ci-static-token-0123456789abcdef0123456789
          call() {
            curl -fsS http://localhost:8787/mcp \
              -H "authorization: Bearer $T" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -d "$1"
          }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/mcp)" = 401
          call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | tee init.json
          grep -q '"carrefour-drive"' init.json
          call '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > tools.json
          grep -q '"carrefour_reorder"' tools.json
          grep -q '"carrefour_browser_login"' tools.json
          if grep -q '"submit_checkout_payment"' tools.json; then echo 'checkout exposed'; exit 1; fi
          curl -fsS http://localhost:8787/.well-known/oauth-authorization-server | grep -q registration_endpoint

      - name: Remote sign-in screen
        run: |
          curl -fsS http://localhost:6080/vnc.html | grep -qi novnc
          T=ci-static-token-0123456789abcdef0123456789
          curl -fsS http://localhost:8787/mcp \
            -H "authorization: Bearer $T" -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"carrefour_browser_login","arguments":{}}}' | tee login.json
          grep -q 'sign-in window is open' login.json
          # Chromium must be up on the virtual screen.
          for i in $(seq 1 30); do
            docker exec cm pgrep -f remote-debugging-port >/dev/null && break
            sleep 1
          done
          docker exec cm pgrep -fa remote-debugging-port | head -1
          port=$(docker exec cm pgrep -fa remote-debugging-port | grep -o 'remote-debugging-port=[0-9]*' | head -1 | cut -d= -f2)
          sleep 5
          docker exec cm node -e "fetch('http://127.0.0.1:$port/json/list').then(r=>r.json()).then(t=>console.log('tabs:', t.filter(x=>x.type==='page').map(x=>x.url).join(' ')))"

      - name: Container logs
        if: always()
        run: docker logs cm 2>&1 | tail -50

  publish:
    name: Publish to GHCR
    needs: test-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
